<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nexmin · Slurry Pump Calc</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <svg class="nexlogo" viewBox="0 0 132 30" role="img" aria-label="Nexmin">
        <polygon points="0,0 7,0 7,30 0,30" fill="#ffffff"/>
        <polygon points="5,0 12,0 24,30 17,30" fill="#ffffff"/>
        <polygon points="22,0 29,0 29,30 22,30" fill="#C8102E"/>
        <text x="38" y="22" font-family="Aptos,Segoe UI,system-ui,sans-serif" font-size="22" font-weight="800" letter-spacing="1" fill="#ffffff">NEXMIN</text>
      </svg>
      <span class="sub">Slurry Pump Calc</span>
    </div>
    <div class="spacer"></div>
    <input id="projName" class="tag-input" placeholder="Project" style="width:160px" />
    <input id="projClient" class="tag-input" placeholder="Client" style="width:140px" />
    <input id="projDoc" class="tag-input" placeholder="Doc No" style="width:150px" />
    <input id="projRev" class="tag-input" placeholder="Rev" style="width:54px" />
    <button id="loadBtn" class="btn btn-ghost">Open .json</button>
    <button id="saveBtn" class="btn btn-ghost">Save .json</button>
    <button id="resetBtn" class="btn btn-ghost">Reset</button>
    <button id="exportBtn" class="btn btn-red">⬇ Export to Excel</button>
    <input id="loadFile" type="file" accept="application/json,.json" style="display:none" />
  </div>

  <div class="app">
    <div class="tabs">
      <div class="tab active" data-tab="calc">Calculator</div>
      <div class="tab" data-tab="summary">Summary</div>
      <div class="tab" data-tab="docs">How it works</div>
      <div class="tab" data-tab="ref">Reference tables</div>
      <div class="tab" data-tab="settle">Settling velocity</div>
    </div>
    <div id="view"></div>
  </div>

  <script src="vendor/exceljs.min.js"></script>
  <script src="data.js"></script>
  <script src="meta.js"></script>
  <script src="engine.js"></script>
  <script src="export.js"></script>
  <script src="app.js"></script>
</body>
</html>
